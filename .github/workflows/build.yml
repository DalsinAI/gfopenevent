# The host tests, the headers against the SFD, and the Amiga build with the
# GFOpenAmigaGCC open6 release and the Open SDK's OpenNDK headers.
name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -q && sudo apt-get install -yq gcc-multilib
          gh release download v16.2.0-open6 -R DalsinAI/gfopengcc -p 'gfopenamigagcc-16.2.0-open6-x86_64-linux.tar.xz' -D /tmp
          tar -C /tmp -xf /tmp/gfopenamigagcc-16.2.0-open6-x86_64-linux.tar.xz
          git clone -q --depth 1 https://github.com/DalsinAI/gfopensdk /tmp/gfopensdk
      - name: Host tests
        run: NDK=/tmp/gfopensdk/OpenNDK/Include_H tests/host/run.sh
      - name: Headers match the SFD
        run: |
          SFDC=/tmp/gfopenamigagcc-16.2.0-open6-x86_64-linux/bin/sfdc tools/gen-headers.sh
          git diff --exit-code include
      - name: Amiga build
        run: |
          CC=/tmp/gfopenamigagcc-16.2.0-open6-x86_64-linux/bin/m68k-amigaos-gcc \
          EXTRA_INC=/tmp/gfopensdk/OpenNDK/Include_H library/build.sh build/amiga
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gfopenevent-amiga
          path: build/amiga
